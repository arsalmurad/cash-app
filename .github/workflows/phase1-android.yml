name: Phase 1 Android

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase1-android
  cancel-in-progress: true

jobs:
  android-emulator:
    name: Personal ledger on Android emulator
    # Tried macos-15 first, on the assumption that macOS runners have
    # hardware-accelerated virtualization for the Android emulator "out of
    # the box" (true for the iOS Simulator in phase1-ios.yml, which uses
    # Apple's own virtualization, not this). In practice, GitHub-hosted
    # macOS-15 (Apple Silicon) runners are themselves nested VMs and do not
    # expose Hypervisor.framework to processes inside them, so *no*
    # emulator architecture can be hardware-accelerated there — every
    # attempt failed with "HVF error: HV_UNSUPPORTED" regardless of AVD
    # arch/API level
    # (https://github.com/actions/runner-images/issues/9472,
    # https://github.com/ReactiveCircus/android-emulator-runner/issues/350).
    # GitHub-hosted Ubuntu runners, by contrast, do expose /dev/kvm and are
    # the officially recommended target for this action (faster and
    # cheaper than macOS too) — see the "Enable KVM group perms" step below.
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Record runner environment
        run: |
          uname -m
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          rustup target add aarch64-linux-android x86_64-linux-android
          rustc --version
          cargo --version

      - name: Install pinned Flutter SDK
        run: |
          git clone --branch 3.47.5 --depth 1 \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Prepare and test Flutter project
        working-directory: app
        run: |
          flutter config --no-analytics
          flutter --version
          flutter precache --android
          flutter pub get
          flutter analyze
          flutter test test

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator and run instrumented test
        uses: reactivecircus/android-emulator-runner@v2
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
        with:
          api-level: 34
          # ubuntu-latest runners are x86_64 hosts, so x86_64 is the
          # architecture that gets KVM hardware acceleration here (unlike
          # macos-15, arm64-v8a would need to be emulated in software).
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # The action tears the emulator down as soon as `script` returns,
          # so the actual test run has to happen in here — a later,
          # separate step no longer has a device to talk to (confirmed by
          # a real run: the emulator booted fine, but the following step
          # saw "No devices are connected").
          script: |
            adb devices
            # "-d android" is not a recognized device selector for flutter
            # test/drive (confirmed by a real run: flutter listed the
            # booted emulator under its actual id, "emulator-5554", and
            # rejected "android" as not matching any device) — the AVD name
            # set above ("test") matches the action's own default and does
            # not appear in that id, so it can't be relied on either.
            # The action runs this script one line at a time, so each test
            # is a single self-contained command (no multi-line loop).
            cd app && flutter test integration_test/ledger_test.dart -d emulator-5554 || { echo "--- logcat tail on failure (ledger_test) ---"; adb logcat -d -t 800; exit 1; }
            cd app && flutter test integration_test/household_test.dart -d emulator-5554 || { echo "--- logcat tail on failure (household_test) ---"; adb logcat -d -t 800; exit 1; }

      - name: Build release APK
        working-directory: app
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
        run: flutter build apk --release

      - name: Record Phase 1 Android result
        shell: bash
        run: |
          set -euo pipefail
          apk_path="$GITHUB_WORKSPACE/app/build/app/outputs/flutter-apk/app-release.apk"
          apk_bytes="$(stat -c '%s' "$apk_path")"
          {
            echo "## Phase 1 Android result"
            echo
            echo "- Personal ledger integration test: passed"
            echo "- Release APK build: passed"
            echo "- app-release.apk bytes: $apk_bytes"
          } | tee -a "$GITHUB_STEP_SUMMARY"
