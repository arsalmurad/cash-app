name: Phase 1 Web

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase1-web
  cancel-in-progress: true

jobs:
  web-wasm:
    name: Personal ledger on Flutter web/WASM
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Record runner environment
        run: |
          uname -m
          google-chrome --version || chromium-browser --version || true

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          rustc --version
          cargo --version

      # `flutter_rust_bridge_codegen build-web` always builds with a
      # nightly toolchain regardless of the project's own pinned stable
      # Rust (it needs unstable `-Z build-std` to produce a
      # thread-capable WASM binary) — this matches what
      # docs/PHASE0-RESULT.md already found for the Phase 0 spike, and is
      # not something this project's own code controls.
      - name: Install nightly Rust toolchain for the WASM build
        run: |
          rustup toolchain install nightly --profile minimal
          rustup component add rust-src --toolchain nightly
          rustup target add wasm32-unknown-unknown --toolchain nightly
          rustup run nightly rustc --version

      - name: Install wasm-pack, wasm-bindgen-cli, and flutter_rust_bridge_codegen
        run: |
          cargo install wasm-pack --version 0.15.0
          # Installed explicitly, with a clean environment, so wasm-pack's
          # own attempt to auto-install it (which inherits the wasm-only
          # RUSTFLAGS wasm-pack sets for the *target* build and wrongly
          # applies them to this *host* build too) is skipped entirely.
          env -u RUSTFLAGS -u RUSTUP_TOOLCHAIN cargo install wasm-bindgen-cli --version 0.2.129
          cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked

      - name: Install pinned Flutter SDK
        run: |
          git clone --branch 3.47.5 --depth 1 \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Prepare and test Flutter project
        working-directory: app
        run: |
          flutter config --no-analytics
          flutter --version
          flutter precache --web
          flutter pub get
          flutter analyze
          flutter test test

      - name: Build the Rust core to WASM
        working-directory: app
        run: |
          flutter_rust_bridge_codegen build-web --rust-root ../rust/api --release

      - name: Build Flutter web/WASM release
        working-directory: app
        run: flutter build web --wasm

      - name: Install and start ChromeDriver
        run: |
          # `chromedriver@stable` installs the latest stable ChromeDriver
          # release, which can be (and, on a real run, was) ahead of the
          # Chrome version actually preinstalled on the runner image —
          # ChromeDriver refuses to create a session against a mismatched
          # major version ("This version of ChromeDriver only supports
          # Chrome version 154. Current browser version is
          # 153.0.8010.52."). Install the driver build matching the
          # installed Chrome's exact version instead of the newest release
          # (Chrome for Testing publishes a matching driver per full
          # version for stable Chrome; a bare major version like
          # "chromedriver@153" is not itself a resolvable build and 403s).
          chrome_version="$(google-chrome --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+')"
          echo "Installed Chrome version: $chrome_version"
          npx --yes @puppeteer/browsers install "chromedriver@$chrome_version" --path "$RUNNER_TEMP/chromedriver"
          driver_bin="$(find "$RUNNER_TEMP/chromedriver" -type f -name chromedriver | head -n1)"
          chmod +x "$driver_bin"
          "$driver_bin" --version
          # `-d web-server` needs a WebDriver server already listening on
          # --driver-port (default 4444) — flutter drive does not spawn one
          # itself. Confirmed by a real run: with chromedriver merely on
          # PATH but not started, it failed fast with "Unable to start a
          # WebDriver session for web testing. Make sure you have the
          # correct WebDriver server (e.g. chromedriver) running at 4444."
          "$driver_bin" --port=4444 &
          echo "Waiting for ChromeDriver to accept connections..."
          for _ in $(seq 1 30); do
            curl -sf http://localhost:4444/status > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4444/status

      - name: Run personal ledger integration test
        working-directory: app
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
        # `-d chrome` (tried first) hung indefinitely at "Waiting for
        # connection from debug service on Chrome..." on two consecutive
        # real CI runs — it runs the app via Chrome's own CDP connection, a
        # different code path from the WebDriver-managed Chrome that
        # flutter drive's driver script actually waits to connect through,
        # so the two were never talking to the same browser instance.
        # `-d web-server` is Flutter's own documented device for this
        # combination, but still needs chromedriver already running as a
        # server (see the previous step) rather than merely on PATH.
        #
        # --cross-origin-isolation: without it, a real run got all the way
        # to the app launching and then panicked immediately inside Rust's
        # thread-pool init ("RuntimeError: unreachable", unwinding from
        # flutter_rust_bridge's WorkerPool::default()). The WASM build
        # uses -Ctarget-feature=atomics (needed for its threaded worker
        # pool), which requires SharedArrayBuffer, which browsers only
        # expose to a cross-origin-isolated page (COOP/COEP headers) —
        # flutter drive's dev server doesn't send those by default.
        run: >-
          flutter drive
          --driver=test_driver/integration_test.dart
          --target=integration_test/ledger_test.dart
          -d web-server --web-port=7357 --browser-name=chrome
          --headless --web-run-headless --cross-origin-isolation

      - name: Record Phase 1 web result
        shell: bash
        run: |
          set -euo pipefail
          web_bytes="$(du -sk "$GITHUB_WORKSPACE/app/build/web" | cut -f1)"
          {
            echo "## Phase 1 web result"
            echo
            echo "- Personal ledger integration test (Chrome, WASM): passed"
            echo "- Web/WASM release build: passed"
            echo "- build/web size: ${web_bytes} KiB"
          } | tee -a "$GITHUB_STEP_SUMMARY"
