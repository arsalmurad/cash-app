name: Phase 1 Web

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase1-web
  cancel-in-progress: true

jobs:
  web-wasm:
    name: Personal ledger on Flutter web/WASM
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Record runner environment
        run: |
          uname -m
          google-chrome --version

      # scripts/verify_web_runtime.mjs uses Node's global WebSocket, which is
      # only stable from Node 22.
      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5, Node 24
        with:
          node-version: 24.19.0

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          rustc --version
          cargo --version

      # FRB needs build-std and atomics, but its documented CLI override allows
      # the exact known-working nightly rather than the moving nightly alias.
      - name: Install nightly Rust toolchain for the WASM build
        run: |
          rustup toolchain install nightly-2026-09-24 --profile minimal
          rustup component add rust-src --toolchain nightly-2026-09-24
          rustup target add wasm32-unknown-unknown --toolchain nightly-2026-09-24
          rustup run nightly-2026-09-24 rustc --version

      - name: Restore compiler and package caches
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-pack
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/flutter_rust_bridge_codegen
            rust/target
            ~/.pub-cache
          key: wasm-${{ runner.os }}-rust1.98.1-nightly2026-09-24-frb2.13.0-${{ hashFiles('rust/Cargo.lock', 'app/pubspec.lock') }}

      - name: Install wasm-pack, wasm-bindgen-cli, and flutter_rust_bridge_codegen
        run: |
          wasm-pack --version 2>/dev/null | grep -qx 'wasm-pack 0.15.0' || cargo install wasm-pack --version 0.15.0 --locked --force
          # Installed explicitly, with a clean environment, so wasm-pack's
          # own attempt to auto-install it (which inherits the wasm-only
          # RUSTFLAGS wasm-pack sets for the *target* build and wrongly
          # applies them to this *host* build too) is skipped entirely.
          wasm-bindgen --version 2>/dev/null | grep -qx 'wasm-bindgen 0.2.129' || env -u RUSTFLAGS -u RUSTUP_TOOLCHAIN cargo install wasm-bindgen-cli --version 0.2.129 --locked --force
          flutter_rust_bridge_codegen --version 2>/dev/null | grep -qx 'flutter_rust_bridge_codegen 2.13.0' || cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked --force

      - name: Install pinned Flutter SDK
        run: |
          git clone --branch 3.47.5 --depth 1 \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Prepare and test Flutter project
        working-directory: app
        run: |
          flutter config --no-analytics
          flutter --version
          flutter precache --web
          flutter --no-version-check pub get --enforce-lockfile
          flutter --no-version-check analyze --no-pub
          flutter --no-version-check test --no-pub test

      - name: Build the Rust core to WASM
        working-directory: app
        env:
          CC_wasm32_unknown_unknown: clang
          CFLAGS_wasm32_unknown_unknown: "-matomics -mbulk-memory"
        run: |
          clang --version
          # Ubuntu may expose only a version-suffixed LLVM tool. The existing
          # Android NDK also ships llvm-ar; reuse it instead of installing LLVM.
          archive_tool="$(command -v llvm-ar-18 || command -v llvm-ar || true)"
          if [ -z "$archive_tool" ] && [ -d "${ANDROID_HOME:-}/ndk" ]; then
            archive_tool="$(find "$ANDROID_HOME/ndk" -path '*/bin/llvm-ar' -type f | sort | head -n 1)"
          fi
          if [ -z "$archive_tool" ]; then
            echo "No LLVM archive tool found in PATH or installed Android NDKs" >&2
            exit 1
          fi
          export AR_wasm32_unknown_unknown="$archive_tool"
          "$archive_tool" --version
          flutter_rust_bridge_codegen build-web --rust-root ../rust/api --release --wasm-pack-rustup-toolchain nightly-2026-09-24

      # --no-web-resources-cdn bundles CanvasKit/skwasm into build/web
      # instead of fetching them from Google's CDN at load time, so the
      # runtime check below depends on nothing outside this checkout.
      - name: Build Flutter web/WASM release
        working-directory: app
        run: flutter build web --wasm --no-web-resources-cdn

      # The runtime check serves the production build above with COOP/COEP
      # headers and drives real Chrome over the DevTools protocol: it
      # records expenses through the Rust bridge, reloads the page (the web
      # equivalent of an app restart, since the event log lives in
      # localStorage), and checks the ledger is rebuilt from storage alone.
      #
      # This replaced a `flutter drive -d web-server` run of
      # integration_test/ledger_test.dart. That path compiles the app to
      # JavaScript rather than WASM, and on every build mode (debug,
      # profile, release) the very first Rust bridge call panicked inside
      # flutter_rust_bridge's WorkerPool ("RuntimeError: unreachable"; see
      # https://github.com/fzyzcjy/flutter_rust_bridge/issues/2914). The
      # production dart2wasm build does not hit it — this script passes
      # against it — so the integration test's web path was the thing that
      # was broken, not web support. See docs/DECISIONS.md.
      - name: Run web runtime verification
        env:
          CHROME_NO_SANDBOX: "1"
          WEB_HOUSEHOLD: "1"
          WEB_HOUSEHOLD_QUOTA: "1"
          WEB_CSV: "1"
          WEB_PERSONAL_LIFECYCLE: "1"
        run: |
          npm ci --prefix relay --no-audit --no-fund
          export CHROME_BINARY="$(command -v google-chrome)"
          node scripts/verify_web_runtime.mjs
          # The pinned skwasm renderer reports an unsupported control glyph for
          # CRLF review text. Keep that data-preservation case above; separately
          # verify the same Unicode title with LF and font CDNs blocked.
          WEB_HOUSEHOLD=0 WEB_OFFLINE_FONTS=1 WEB_CSV_LINE_ENDINGS=LF node scripts/verify_web_runtime.mjs

      - name: Record Phase 1 web result
        shell: bash
        run: |
          set -euo pipefail
          web_bytes="$(du -sk "$GITHUB_WORKSPACE/app/build/web" | cut -f1)"
          {
            echo "## Phase 1 web result"
            echo
            echo "- Personal ledger runtime check (Chrome, WASM, reload persistence): passed"
            echo "- Household runtime check (HTTP/CORS, sealed restart, offline conflict, fresh-key recovery, removal): passed"
            echo "- Web/WASM release build: passed"
            echo "- build/web size: ${web_bytes} KiB"
          } | tee -a "$GITHUB_STEP_SUMMARY"
