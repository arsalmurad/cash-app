name: Phase 2 Shared Layer

on:
  workflow_dispatch:
  # Cheap enough to run on every change to the shared layer, and lets a new
  # branch be checked before this workflow exists on the default branch
  # (workflow_dispatch only finds workflows already merged there).
  pull_request:
    paths:
      - "rust/**"
      - "relay/**"
      - "scripts/verify_relay.sh"
      - ".github/workflows/phase2-shared.yml"

permissions:
  contents: read

concurrency:
  group: phase2-shared-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-layer:
    name: MLS, sync engine, and relay worker
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          rustup component add clippy --toolchain 1.98.1
          rustc --version

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5, Node 24
        with:
          node-version: 24.19.0

      - name: Restore Rust and relay caches
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
            ~/.npm
          key: shared-${{ runner.os }}-rust1.98.1-node24.19.0-${{ hashFiles('rust/Cargo.lock', 'relay/package-lock.json') }}

      - name: Strict Rust workspace lint
        working-directory: rust
        run: cargo clippy --workspace --all-targets --locked --features cash_sync/relay-auth -- -D warnings

      - name: Rust workspace tests (core, crypto, sync)
        working-directory: rust
        run: cargo test --workspace --locked --features cash_sync/relay-auth

      # Runs the worker's own tests in workerd (via miniflare), then the
      # real Rust sync engine against that running worker.
      - name: Relay worker and cross-implementation check
        run: scripts/verify_relay.sh

      - name: Inspect actual worker storage for plaintext
        working-directory: relay
        run: npm run test:storage

      - name: Verify Rust device request proofs in actual workerd
        working-directory: relay
        run: npm run test:request-proof-rust

      - name: Record Phase 2 result
        shell: bash
        run: |
          {
            echo "## Phase 2 shared layer"
            echo
            echo "- Strict cargo clippy --workspace --all-targets: passed"
            echo "- cargo test --workspace (three-peer exit scenario, MLS, shared fold): passed"
            echo "- Relay worker tests in workerd: passed"
            echo "- Rust sync engine against the running worker: passed"
            echo "- Actual workerd storage scan and plaintext-injection negative control: passed"
          } | tee -a "$GITHUB_STEP_SUMMARY"
