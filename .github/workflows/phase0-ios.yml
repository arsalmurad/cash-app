name: Phase 0 iOS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase0-ios
  cancel-in-progress: true

jobs:
  ios-simulator:
    name: OpenMLS bridge on iOS simulator
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Record runner environment
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          pod --version

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          rustc --version
          cargo --version

      - name: Install pinned Flutter SDK
        run: |
          git clone --branch 3.47.5 --depth 1 \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Prepare Flutter project
        working-directory: mls_spike
        run: |
          flutter config --no-analytics
          flutter --version
          flutter precache --ios
          flutter pub get
          flutter analyze

      - name: Boot an available iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          device_id="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime_devices in devices.values():
              for device in runtime_devices:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator was found")
          ')"
          echo "udid=$device_id" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$device_id" || true
          xcrun simctl bootstatus "$device_id" -b

      - name: Run OpenMLS bridge integration test
        working-directory: mls_spike
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
        run: >-
          flutter test integration_test/mls_test.dart
          -d "${{ steps.simulator.outputs.udid }}"

      - name: Build unsigned iOS release
        working-directory: mls_spike
        env:
          RUSTUP_TOOLCHAIN: 1.98.1
        run: flutter build ios --release --no-codesign

      - name: Measure release bundle against minimal Flutter baseline
        shell: bash
        run: |
          set -euo pipefail
          app_bytes() {
            find "$1" -type f -exec stat -f '%z' {} + |
              awk '{ total += $1 } END { print total + 0 }'
          }

          spike_app="$GITHUB_WORKSPACE/mls_spike/build/ios/iphoneos/Runner.app"
          baseline="$RUNNER_TEMP/flutter_ios_baseline"
          flutter create --platforms=ios --org com.example "$baseline"
          (
            cd "$baseline"
            flutter build ios --release --no-codesign
          )

          spike_bytes="$(app_bytes "$spike_app")"
          baseline_bytes="$(app_bytes "$baseline/build/ios/iphoneos/Runner.app")"
          delta_bytes="$((spike_bytes - baseline_bytes))"

          {
            echo "## Phase 0 iOS result"
            echo
            echo "- Simulator integration test: passed"
            echo "- Spike Runner.app bytes: $spike_bytes"
            echo "- Minimal Flutter Runner.app bytes: $baseline_bytes"
            echo "- OpenMLS bridge size delta bytes: $delta_bytes"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Shut down simulator
        if: always() && steps.simulator.outputs.udid != ''
        run: xcrun simctl shutdown "${{ steps.simulator.outputs.udid }}" || true
