name = "cash-app-relay"
main = "src/worker.js"
compatibility_date = "2026-07-01"

# Intentionally no LOCAL_DEVELOPMENT binding. Default deployments refuse all
# data routes until production authentication/abuse controls are implemented.
# Use the loopback-only Node development launcher for acceptance tests.

[[durable_objects.bindings]]
name = "GROUP"
class_name = "GroupLog"

[[durable_objects.bindings]]
name = "MAILBOX"
class_name = "Mailbox"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GroupLog", "Mailbox"]
