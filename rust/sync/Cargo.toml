[package]
name = "cash_sync"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
# An HTTP client for the Cloudflare relay in `/relay`. Off by default: the
# app reaches the relay through Dart's own HTTP stack, and this exists to
# verify the real worker against the real sync engine.
http = ["dep:ureq", "dep:serde_json", "dep:base64"]

[dependencies]
cash_core = { path = "../core" }
cash_crypto = { path = "../crypto" }
base64 = { version = "0.22", optional = true }
serde_json = { version = "1", optional = true }
ureq = { version = "2", features = ["json"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.2.17", features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.2"
