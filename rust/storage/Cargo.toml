[package]
name = "cash_storage"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "=0.40.1", default-features = false, features = ["bundled", "serialize"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rusqlite = { version = "=0.40.1", default-features = false, features = ["ffi-sqlite-wasm-rs", "serialize"] }
sqlite-wasm-rs = "=0.5.1"

[dev-dependencies]
tempfile = "=3.27.0"
